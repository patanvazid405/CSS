<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class</title>
    <link rel="stylesheet" href="psudeo.css">
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item item-2">2</div>
        <div class="item item-3">3</div>
        <div class="item item-4">4</div>
        <div class="item item-5">5</div>
    </div>

    <a href="www.google.com">Google</a><br><br>

    <div class="ul">
        <ul>
            <li>Hi</li>
            <li>Hi</li>
            <li>Hi</li>
            <li>Hi</li>
            <li>Hi</li>
        </ul>
    </div>

    <div class="parent">
        <input type="radio" name="img" id="#a" value="1">
        <input type="radio" name="img" id="#b" value="2">
        <input type="radio" name="img" id="#c" value="3">
        <div class="img">
            <img src="../tasks/imgs/croissant.jpg" alt="">
            <img src="../tasks/imgs/cherries.jpg" alt="">
            <img src="../tasks/imgs/steak.jpg" alt="">
        </div>
    </div>
</body>
</html>
